    <!--
      Sets data-theme before first paint so an explicit preference doesn't
      flash the other theme. Absence of a stored preference is left alone —
      styles/themes/_dark.scss already follows the OS preference live via
      `:not([data-theme='light'])`, and useTheme() picks up from there.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.dataset.theme = stored;
          }
        } catch (e) {}
      })();
    </script>
